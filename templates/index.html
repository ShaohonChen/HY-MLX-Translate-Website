<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hy-MT2 本地翻译助手</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f5f7;
            --surface: #ffffff;
            --surface-muted: #f8f9fb;
            --line: #e4e7ec;
            --line-strong: #cfd4dc;
            --text: #17191c;
            --muted: #737981;
            --accent: #2457d6;
            --accent-hover: #1e49b5;
            --danger: #c73b4a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--bg);
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        button,
        select,
        textarea {
            font: inherit;
        }

        .app-shell {
            width: min(100%, 1680px);
            min-height: 100vh;
            margin: 0 auto;
            padding: 22px 28px 18px;
            display: flex;
            flex-direction: column;
        }

        .app-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 20px;
            padding: 0 2px 16px;
        }

        h1 {
            font-size: 21px;
            font-weight: 650;
            letter-spacing: -0.02em;
        }

        .model-info {
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }

        .workspace {
            min-height: calc(100vh - 164px);
            display: flex;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: 0 12px 36px rgba(20, 27, 39, 0.06);
        }

        .controls {
            display: grid;
            grid-template-columns: minmax(360px, 1fr) auto;
            align-items: center;
            gap: 12px 18px;
            padding: 12px 14px;
            background: var(--surface-muted);
            border-bottom: 1px solid var(--line);
        }

        .language-section,
        .language-selector,
        .action-section,
        #quickLangButtons {
            display: flex;
            align-items: center;
        }

        .language-section,
        .language-selector {
            min-width: 0;
            gap: 10px;
        }

        .section-title {
            color: #454a52;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }

        .select-wrapper {
            width: min(290px, 100%);
            min-width: 180px;
        }

        select {
            width: 100%;
            height: 38px;
            padding: 0 34px 0 11px;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--line-strong);
            border-radius: 8px;
            font-size: 13px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(36, 87, 214, 0.12);
        }

        #quickLangButtons {
            gap: 6px;
        }

        .quick-lang-btn,
        .btn {
            height: 38px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .quick-lang-btn:active,
        .btn:active {
            transform: translateY(1px);
        }

        .quick-lang-btn {
            min-width: 54px;
            padding: 0 13px;
            background: var(--surface);
            color: #4d535c;
            border: 1px solid var(--line-strong);
        }

        .quick-lang-btn:hover {
            background: #f0f3f8;
            border-color: #adb5c1;
        }

        .quick-lang-btn.active {
            background: #e9efff;
            color: var(--accent);
            border-color: #9bb2ef;
        }

        .action-section {
            justify-content: flex-end;
            gap: 8px;
        }

        .btn {
            padding: 0 16px;
            background: var(--accent);
            color: white;
            border: 1px solid var(--accent);
        }

        .btn:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .btn-cancel,
        .btn-cancel:hover {
            background: var(--danger);
            border-color: var(--danger);
        }

        .btn-reference {
            background: var(--surface);
            color: #4f5660;
            border-color: var(--line-strong);
        }

        .btn-reference:hover,
        .btn-reference.active {
            background: #eef1f5;
            color: var(--text);
            border-color: #adb5c1;
        }

        .reference-section {
            display: none;
            grid-column: 1 / -1;
            flex-direction: column;
            gap: 8px;
            padding-top: 2px;
        }

        .reference-section.visible {
            display: flex;
        }

        .reference-textarea {
            min-height: 92px;
            max-height: 180px;
            padding: 12px 14px;
            background: var(--surface);
            border: 1px solid var(--line-strong);
            border-radius: 8px;
            resize: vertical;
        }

        .main-content {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            flex: 1;
            min-height: 520px;
        }

        .editor-panel {
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .editor-panel + .editor-panel {
            border-left: 1px solid var(--line);
        }

        .panel-header {
            min-height: 44px;
            display: flex;
            align-items: center;
            padding: 0 18px;
            border-bottom: 1px solid var(--line);
        }

        .panel-title {
            color: #3f444b;
            font-size: 13px;
            font-weight: 650;
            letter-spacing: 0.01em;
        }

        textarea {
            width: 100%;
            color: var(--text);
            caret-color: var(--accent);
            font-family: inherit;
            font-size: 16px;
            line-height: 1.75;
        }

        textarea:focus {
            outline: none;
        }

        textarea::placeholder {
            color: #a2a7ae;
        }

        textarea:disabled,
        textarea[readonly] {
            color: #25282d;
        }

        .text-match-box {
            position: relative;
            flex: 1;
            min-height: 470px;
            background: var(--surface);
        }

        .text-match-box.result-box {
            background: #fbfcfe;
        }

        .text-match-box textarea {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: block;
            height: 100%;
            padding: 22px 24px;
            overflow: auto;
            background: transparent;
            border: 0;
            border-radius: 0;
            resize: none;
        }

        .highlight-layer {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            padding: 22px 24px;
            border: 0;
            font-family: inherit;
            font-size: 16px;
            line-height: 1.75;
            color: transparent;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            pointer-events: none;
        }

        .highlight-layer mark {
            color: transparent;
            background: rgba(255, 230, 120, 0.75);
            border-radius: 2px;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: #fff3f4;
            border: 1px solid #efc3c8;
            color: #a12230;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 14px;
        }

        .performance-details {
            margin-top: 10px;
            color: var(--muted);
            border: 1px solid transparent;
            border-radius: 10px;
        }

        .performance-details[open] {
            background: rgba(255, 255, 255, 0.62);
            border-color: var(--line);
        }

        .performance-details summary {
            width: fit-content;
            padding: 8px 10px;
            border-radius: 7px;
            font-size: 12px;
            cursor: pointer;
            user-select: none;
        }

        .performance-details summary:hover {
            color: #444a52;
            background: rgba(255, 255, 255, 0.8);
        }

        .details-hint {
            margin-left: 6px;
            color: #9ba0a7;
        }

        .stats-panel {
            display: grid;
            grid-template-columns: repeat(8, minmax(90px, 1fr));
            gap: 8px;
            padding: 8px 10px 12px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 8px 10px;
        }

        .stat-label {
            color: #8b9098;
            font-size: 10px;
        }

        .stat-value {
            color: #4b5159;
            font-size: 14px;
            font-weight: 550;
        }

        .footer {
            padding: 10px 4px 0;
            text-align: center;
            color: #a0a4aa;
            font-size: 11px;
            line-height: 1.5;
        }

        .footer a {
            color: #666;
            text-decoration: none;
        }

        .footer a:hover {
            color: #333;
            text-decoration: underline;
        }

        @media (max-width: 1040px) {
            .controls {
                grid-template-columns: 1fr;
            }

            .action-section {
                justify-content: stretch;
            }

            .action-section .btn {
                flex: 1;
            }

            .stats-panel {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 720px) {
            .app-shell {
                padding: 14px 12px 12px;
            }

            .app-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 4px;
                padding: 0 2px 12px;
            }

            h1 {
                font-size: 19px;
            }

            .model-info {
                white-space: normal;
            }

            .workspace {
                min-height: auto;
                overflow: visible;
                border-radius: 11px;
            }

            .language-section,
            .language-selector {
                align-items: stretch;
                flex-direction: column;
            }

            .select-wrapper {
                width: 100%;
            }

            .action-section {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

            #translateBtn {
                grid-column: 1 / -1;
            }

            .main-content {
                grid-template-columns: 1fr;
                min-height: 0;
            }

            .editor-panel + .editor-panel {
                border-top: 1px solid var(--line);
                border-left: 0;
            }

            .text-match-box {
                min-height: 340px;
            }

            .text-match-box textarea,
            .highlight-layer {
                padding: 18px;
            }

            .stats-panel {
                grid-template-columns: repeat(2, 1fr);
            }

            .details-hint {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <h1 id="pageTitle">Hy-MT2-1.8B Mac 本地翻译助手</h1>
            <p id="modelInfo" class="model-info">本地运行 · MLX 加速 · 流式翻译</p>
        </header>

        <main class="workspace">
            <div class="controls">
                <div class="language-section">
                    <label class="section-title" for="targetLanguage">翻译为</label>
                    <div class="language-selector">
                        <div class="select-wrapper">
                            <select id="targetLanguage">
                                <option value="">加载中...</option>
                            </select>
                        </div>
                        <div id="quickLangButtons" aria-label="快捷语言"></div>
                    </div>
                </div>
                <div class="action-section">
                    <button class="btn btn-reference" id="referenceBtn" type="button" aria-expanded="false" aria-controls="referenceSection" onclick="toggleReference()">添加参考</button>
                    <button class="btn btn-reference" id="removeBreaksBtn" type="button" onclick="removeLineBreaks()">整理换行</button>
                    <button class="btn" id="translateBtn" type="button" onclick="handleButtonClick()">翻译</button>
                </div>
                <div class="reference-section" id="referenceSection">
                    <label class="section-title" for="referText">参考文本</label>
                    <textarea id="referText" class="reference-textarea" placeholder="可选：提供术语、语境或参考译文"></textarea>
                </div>
            </div>

            <div class="main-content">
                <section class="editor-panel" aria-labelledby="sourceLabel">
                    <div class="panel-header">
                        <span class="panel-title" id="sourceLabel">原文</span>
                    </div>
                    <div class="text-match-box">
                        <div id="sourceHighlight" class="highlight-layer"></div>
                        <textarea id="sourceText" aria-label="输入文本" placeholder="在这里输入或粘贴要翻译的文本..."></textarea>
                    </div>
                </section>

                <section class="editor-panel" aria-labelledby="resultLabel">
                    <div class="panel-header">
                        <span class="panel-title" id="resultLabel">译文</span>
                    </div>
                    <div class="text-match-box result-box">
                        <div id="resultHighlight" class="highlight-layer"></div>
                        <textarea id="resultText" class="result-textarea" aria-label="翻译结果" readonly placeholder="翻译结果将在这里实时生成"></textarea>
                    </div>
                </section>
            </div>
        </main>

        <div id="error" style="display: none;" class="error" role="alert" aria-live="polite"></div>

        <details class="performance-details">
            <summary>运行详情 <span class="details-hint">Tokens、耗时与推理速度</span></summary>
            <div id="stats" class="stats-panel">
                <div class="stat-item">
                    <span class="stat-label">Prompt Tokens</span>
                    <span class="stat-value" id="stat-prompt-tokens">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Complete Tokens</span>
                    <span class="stat-value" id="stat-complete-tokens">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Prefill · tokens/s</span>
                    <span class="stat-value" id="stat-prefill-speed">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Generation · tokens/s</span>
                    <span class="stat-value" id="stat-complete-speed">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Total Time · s</span>
                    <span class="stat-value" id="stat-total-time">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">TTFT · s</span>
                    <span class="stat-value" id="stat-ttft">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">TPOT · s</span>
                    <span class="stat-value" id="stat-tpot">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Total Tokens</span>
                    <span class="stat-value" id="stat-token-count">0</span>
                </div>
            </div>
        </details>

        <footer class="footer">
            ShaohonChen · <a href="https://github.com/ShaohonChen/HY-MLX-Translator" target="_blank" rel="noreferrer">GitHub</a>
            · <a href="https://huggingface.co/tencent/Hy-MT2-1.8B" target="_blank" rel="noreferrer">腾讯混元 Hy-MT2-1.8B</a>
        </footer>
    </div>

    <script>
        async function loadLanguages() {
            const select = document.getElementById('targetLanguage');
            const translateBtn = document.getElementById('translateBtn');
            select.disabled = true;
            translateBtn.disabled = true;

            try {
                const response = await fetch('/api/languages');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();

                select.innerHTML = '';

                // 填充语言下拉选择
                for (const [key, value] of Object.entries(data.languages)) {
                    const option = document.createElement('option');
                    option.value = key;
                    option.textContent = `${key} (${value})`;
                    select.appendChild(option);
                }

                // 动态生成快捷按钮
                const quickLangButtonsContainer = document.getElementById('quickLangButtons');
                quickLangButtonsContainer.innerHTML = '';
                for (const lang of data.quick_langs) {
                    const btn = document.createElement('button');
                    btn.className = 'quick-lang-btn';
                    btn.id = `quick${lang.key}Btn`;
                    btn.textContent = lang.label;
                    btn.onclick = () => selectLanguage(lang.key);
                    quickLangButtonsContainer.appendChild(btn);
                }

                // 默认设置为中文
                if (data.quick_langs.length > 0) {
                    select.value = data.quick_langs[0].key;
                } else {
                    select.value = Object.keys(data.languages)[0];
                }
                updateQuickLangButtons();
                document.getElementById('pageTitle').textContent = `${data.model} Mac 本地翻译助手`;
                document.getElementById('modelInfo').textContent =
                    `${data.language_count} 个语言选项 · 本地运行 · MLX 加速 · 流式翻译`;
            } catch (error) {
                console.error('加载语言列表失败:', error);
                select.innerHTML = '<option value="">语言列表加载失败</option>';
                showError('语言列表加载失败，请确认后端服务正常后刷新页面');
            } finally {
                select.disabled = select.options.length === 0 || !select.value;
                translateBtn.disabled = select.disabled;
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function clearError() {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = '';
            errorDiv.style.display = 'none';
        }

        function selectLanguage(lang) {
            const select = document.getElementById('targetLanguage');
            select.value = lang;
            updateQuickLangButtons();
        }

        function updateQuickLangButtons() {
            const select = document.getElementById('targetLanguage');
            const quickButtons = document.querySelectorAll('#quickLangButtons .quick-lang-btn');

            quickButtons.forEach(btn => {
                const langKey = btn.id.replace('quick', '').replace('Btn', '');
                btn.classList.toggle('active', select.value === langKey);
            });
        }

        function toggleReference() {
            const referenceBtn = document.getElementById('referenceBtn');
            const referenceSection = document.getElementById('referenceSection');
            const referText = document.getElementById('referText');

            referenceSection.classList.toggle('visible');
            referenceBtn.classList.toggle('active');
            referenceBtn.setAttribute(
                'aria-expanded',
                referenceSection.classList.contains('visible')
            );

            if (!referenceSection.classList.contains('visible')) {
                referText.value = '';
            }
        }

        function removeLineBreaks() {
            const sourceText = document.getElementById('sourceText');
            const referText = document.getElementById('referText');

            sourceText.value = sourceText.value.replace(/[\r\n]+/g, '');
            if (referText.value) {
                referText.value = referText.value.replace(/[\r\n]+/g, '');
            }
            handleTextChanged('source');
        }

        function resetStats() {
            document.getElementById('stat-token-count').textContent = '0';
            document.getElementById('stat-prompt-tokens').textContent = '0';
            document.getElementById('stat-complete-tokens').textContent = '0';
            document.getElementById('stat-prefill-speed').textContent = '0';
            document.getElementById('stat-complete-speed').textContent = '0';
            document.getElementById('stat-total-time').textContent = '0';
            document.getElementById('stat-ttft').textContent = '0';
            document.getElementById('stat-tpot').textContent = '0';
        }

        let currentRequestId = null;
        let currentReader = null;
        let isTranslating = false;
        let cancelRequested = false;
        let autoScrollEnabled = true;
        let resultTextComplete = true;
        let activeSelectionSide = null;
        let selectionTimer = null;
        let sentenceSegmenter = null;

            const sourceTextarea = document.getElementById('sourceText');
            const resultTextarea = document.getElementById('resultText');
            const sourceHighlightLayer = document.getElementById('sourceHighlight');
            const resultHighlightLayer = document.getElementById('resultHighlight');
            const textIndexes = {
                source: null,
                result: null
            };
            const SENTENCE_END_PATTERN = /[。！？.!?]/;
            const SENTENCE_CLOSER_PATTERN = /["'”’）)\]】》」』]/;
            const CONTINUATION_START_PATTERN = /[a-z0-9\u3400-\u9fff\u3040-\u30ff\uac00-\ud7af,，、;；:：）)\]】》」』]/;
            const ABBREVIATION_TAIL_PATTERN = /(?:^|[\s([（【「『,，、;；:：])((?:[A-Za-z]\.){2,}|[A-Za-z]{1,12}\.)$/;
            const DOTTED_ABBREVIATION_PATTERN = /^(?:[A-Za-z]\.){2,}$/;
            const ALPHA_DOT_PATTERN = /[A-Za-z.]/;
            const WHITESPACE_PATTERN = /\s/;
            const HARD_ABBREVIATIONS = new Set([
                'e.g.', 'i.e.', 'vs.', 'cf.', 'mr.', 'mrs.', 'ms.', 'dr.',
                'prof.', 'sr.', 'jr.', 'st.'
            ]);
            const SOFT_ABBREVIATIONS = new Set([
                'etc.', 'al.', 'fig.', 'eq.', 'ref.', 'no.', 'vol.', 'pp.',
                'inc.', 'ltd.', 'co.', 'corp.', 'dept.', 'univ.'
            ]);

            function getTextarea(side) {
                return side === 'source' ? sourceTextarea : resultTextarea;
            }

            function getHighlightLayer(side) {
                return side === 'source' ? sourceHighlightLayer : resultHighlightLayer;
            }

            function getOtherSide(side) {
                return side === 'source' ? 'result' : 'source';
            }

            function escapeHtml(text) {
                return text
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function hasSentenceEnd(text) {
                const trimmed = trimSentenceClosers(text.trim());
                if (!trimmed) {
                    return false;
                }

                const endIndex = trimmed.length - 1;
                const endChar = trimmed[endIndex];
                return SENTENCE_END_PATTERN.test(endChar) &&
                    (endChar !== '.' || !isAbbreviationPeriod(trimmed, endIndex, false));
            }

            function getSentenceBoundaryEnd(text, punctuationIndex) {
                let end = punctuationIndex + 1;
                while (end < text.length && SENTENCE_END_PATTERN.test(text[end])) {
                    end += 1;
                }
                while (end < text.length && SENTENCE_CLOSER_PATTERN.test(text[end])) {
                    end += 1;
                }
                return end;
            }

            function getLastBoundaryCharIndex(text, offset) {
                let index = offset - 1;
                while (index >= 0 && WHITESPACE_PATTERN.test(text[index])) {
                    index -= 1;
                }
                while (index >= 0 && SENTENCE_CLOSER_PATTERN.test(text[index])) {
                    index -= 1;
                }
                return index;
            }

            function getFirstContentChar(text, offset) {
                for (let index = offset; index < text.length; index += 1) {
                    if (!WHITESPACE_PATTERN.test(text[index])) {
                        return text[index];
                    }
                }
                return '';
            }

            function trimSentenceClosers(text) {
                let end = text.length;
                while (end > 0 && SENTENCE_CLOSER_PATTERN.test(text[end - 1])) {
                    end -= 1;
                }
                return text.slice(0, end);
            }

            function getAlphaDotToken(text, offset) {
                let start = offset;
                let end = offset + 1;
                while (start > 0 && ALPHA_DOT_PATTERN.test(text[start - 1])) {
                    start -= 1;
                }
                while (end < text.length && ALPHA_DOT_PATTERN.test(text[end])) {
                    end += 1;
                }
                return { end, value: text.slice(start, end) };
            }

            function getAbbreviationBefore(text, dotIndex) {
                const prefix = trimSentenceClosers(text.slice(0, dotIndex + 1)).trim();
                return prefix.match(ABBREVIATION_TAIL_PATTERN)?.[1].toLowerCase() || '';
            }

            function isInsideDottedAbbreviation(text, dotIndex) {
                const token = getAlphaDotToken(text, dotIndex);
                return DOTTED_ABBREVIATION_PATTERN.test(token.value) && dotIndex < token.end - 1;
            }

            function isKnownAbbreviation(abbreviation) {
                return HARD_ABBREVIATIONS.has(abbreviation) ||
                    SOFT_ABBREVIATIONS.has(abbreviation) ||
                    DOTTED_ABBREVIATION_PATTERN.test(abbreviation);
            }

            function isAbbreviationPeriod(text, dotIndex, textComplete) {
                if (isInsideDottedAbbreviation(text, dotIndex)) {
                    return true;
                }

                const abbreviation = getAbbreviationBefore(text, dotIndex);
                if (!isKnownAbbreviation(abbreviation)) {
                    return false;
                }

                const nextChar = getFirstContentChar(text, getSentenceBoundaryEnd(text, dotIndex));
                if (!nextChar) {
                    return !textComplete;
                }

                return HARD_ABBREVIATIONS.has(abbreviation) ||
                    CONTINUATION_START_PATTERN.test(nextChar);
            }

            function addSentence(sentences, paragraphText, paragraphStart, rawStart, rawEnd, textComplete) {
                let start = rawStart;
                let end = rawEnd;

                while (start < end && WHITESPACE_PATTERN.test(paragraphText[start])) {
                    start += 1;
                }
                while (end > start && WHITESPACE_PATTERN.test(paragraphText[end - 1])) {
                    end -= 1;
                }
                if (start >= end) {
                    return;
                }

                const content = paragraphText.slice(start, end);
                sentences.push({
                    sentenceIndex: sentences.length,
                    start: paragraphStart + start,
                    end: paragraphStart + end,
                    isComplete: textComplete || hasSentenceEnd(content)
                });
            }

            function getSentenceSegmenter() {
                if (!('Intl' in window) || !('Segmenter' in Intl)) {
                    return null;
                }
                if (!sentenceSegmenter) {
                    sentenceSegmenter = new Intl.Segmenter(undefined, { granularity: 'sentence' });
                }
                return sentenceSegmenter;
            }

            function shouldSplitAt(text, punctuationIndex, textComplete) {
                const char = text[punctuationIndex];
                return char !== '.' || !isAbbreviationPeriod(text, punctuationIndex, textComplete);
            }

            function mergeAbbreviationSegments(segments, text, textComplete) {
                const merged = [];
                for (const current of segments) {
                    const previous = merged[merged.length - 1];
                    const boundaryIndex = previous ? getLastBoundaryCharIndex(text, previous.end) : -1;

                    if (previous && !shouldSplitAt(text, boundaryIndex, textComplete)) {
                        previous.end = current.end;
                    } else {
                        merged.push({ ...current });
                    }
                }
                return merged;
            }

            function splitByPunctuation(text, textComplete) {
                const ranges = [];
                let start = 0;
                let index = 0;

                while (index < text.length) {
                    if (!SENTENCE_END_PATTERN.test(text[index])) {
                        index += 1;
                        continue;
                    }

                    const end = getSentenceBoundaryEnd(text, index);
                    if (shouldSplitAt(text, index, textComplete)) {
                        ranges.push({ start, end });
                        start = end;
                    }
                    index = end;
                }

                if (start < text.length) {
                    ranges.push({ start, end: text.length });
                }
                return ranges;
            }

            function getSentenceRanges(text, textComplete) {
                const segmenter = getSentenceSegmenter();
                if (!segmenter) {
                    return splitByPunctuation(text, textComplete);
                }

                const ranges = Array.from(segmenter.segment(text), segment => ({
                    start: segment.index,
                    end: segment.index + segment.segment.length
                }));
                return mergeAbbreviationSegments(ranges, text, textComplete);
            }

            function splitSentences(paragraphText, paragraphStart, textComplete) {
                const sentences = [];
                for (const range of getSentenceRanges(paragraphText, textComplete)) {
                    addSentence(sentences, paragraphText, paragraphStart, range.start, range.end, textComplete);
                }
                return sentences;
            }

            function buildTextIndex(text, textComplete) {
                const paragraphs = [];
                const paragraphPattern = /[^\r\n]+/g;
                let match;

                while ((match = paragraphPattern.exec(text)) !== null) {
                    if (!match[0].trim()) {
                        continue;
                    }
                    const paragraph = {
                        paragraphIndex: paragraphs.length,
                        start: match.index,
                        end: match.index + match[0].length,
                        sentences: splitSentences(match[0], match.index, textComplete)
                    };
                    paragraphs.push(paragraph);
                }

                return {
                    text,
                    paragraphs
                };
            }

            function updateTextIndex(side) {
                const textarea = getTextarea(side);
                const textComplete = side === 'source' ? true : resultTextComplete;
                textIndexes[side] = buildTextIndex(textarea.value, textComplete);
            }

            function updateAllTextIndexes() {
                updateTextIndex('source');
                updateTextIndex('result');
            }

            function rangesIntersect(startA, endA, startB, endB) {
                return startA < endB && endA > startB;
            }

            function getTouchedParagraphs(index, selectionStart, selectionEnd) {
                return index.paragraphs.filter(paragraph => (
                    rangesIntersect(selectionStart, selectionEnd, paragraph.start, paragraph.end)
                ));
            }

            function getTouchedSentences(paragraph, selectionStart, selectionEnd) {
                return paragraph.sentences.filter(sentence => (
                    sentence.isComplete &&
                    rangesIntersect(selectionStart, selectionEnd, sentence.start, sentence.end)
                ));
            }

            function mapParagraphsToRanges(paragraphs, targetIndex) {
                const firstIndex = paragraphs[0].paragraphIndex;
                const lastIndex = paragraphs[paragraphs.length - 1].paragraphIndex;

                return targetIndex.paragraphs
                    .filter(paragraph => (
                        paragraph.paragraphIndex >= firstIndex &&
                        paragraph.paragraphIndex <= lastIndex
                    ))
                    .map(paragraph => ({
                        start: paragraph.start,
                        end: paragraph.end
                    }));
            }

            function mapSentencesToRanges(paragraph, sentences, targetIndex) {
                const targetParagraph = targetIndex.paragraphs.find(item => (
                    item.paragraphIndex === paragraph.paragraphIndex
                ));
                if (!targetParagraph) {
                    return [];
                }

                const firstIndex = sentences[0].sentenceIndex;
                const lastIndex = sentences[sentences.length - 1].sentenceIndex;

                return targetParagraph.sentences
                    .filter(sentence => (
                        sentence.isComplete &&
                        sentence.sentenceIndex >= firstIndex &&
                        sentence.sentenceIndex <= lastIndex
                    ))
                    .map(sentence => ({
                        start: sentence.start,
                        end: sentence.end
                    }));
            }

            function getMatchedRanges(side) {
                const textarea = getTextarea(side);
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                if (start === end) {
                    return [];
                }

                updateAllTextIndexes();

                const sourceIndex = textIndexes[side];
                const targetIndex = textIndexes[getOtherSide(side)];
                if (!sourceIndex || !targetIndex || !targetIndex.text) {
                    return [];
                }

                const touchedParagraphs = getTouchedParagraphs(sourceIndex, start, end);
                if (touchedParagraphs.length === 0) {
                    return [];
                }

                if (touchedParagraphs.length > 1) {
                    return mapParagraphsToRanges(touchedParagraphs, targetIndex);
                }

                const touchedSentences = getTouchedSentences(touchedParagraphs[0], start, end);
                if (touchedSentences.length === 0) {
                    return [];
                }

                return mapSentencesToRanges(touchedParagraphs[0], touchedSentences, targetIndex);
            }

            function mergeRanges(ranges, textLength) {
                const normalized = ranges
                    .map(range => ({
                        start: Math.max(0, Math.min(range.start, textLength)),
                        end: Math.max(0, Math.min(range.end, textLength))
                    }))
                    .filter(range => range.start < range.end)
                    .sort((a, b) => a.start - b.start);

                const merged = [];
                for (const range of normalized) {
                    const last = merged[merged.length - 1];
                    if (last && range.start <= last.end) {
                        last.end = Math.max(last.end, range.end);
                    } else {
                        merged.push({ ...range });
                    }
                }
                return merged;
            }

            function renderHighlight(side, ranges) {
                const textarea = getTextarea(side);
                const layer = getHighlightLayer(side);
                const mergedRanges = mergeRanges(ranges, textarea.value.length);

                if (mergedRanges.length === 0) {
                    layer.innerHTML = '';
                    return;
                }

                let html = '';
                let cursor = 0;
                for (const range of mergedRanges) {
                    html += escapeHtml(textarea.value.slice(cursor, range.start));
                    html += `<mark>${escapeHtml(textarea.value.slice(range.start, range.end))}</mark>`;
                    cursor = range.end;
                }
                html += escapeHtml(textarea.value.slice(cursor));
                if (textarea.value.endsWith('\n')) {
                    html += ' ';
                }
                layer.innerHTML = html;
                syncHighlightScroll(side);
            }

            function clearHighlights() {
                activeSelectionSide = null;
                renderHighlight('source', []);
                renderHighlight('result', []);
            }

            function applySelectionHighlight(side) {
                const otherSide = getOtherSide(side);
                const textarea = getTextarea(side);

                if (textarea.selectionStart === textarea.selectionEnd) {
                    clearHighlights();
                    return;
                }

                activeSelectionSide = side;
                renderHighlight(side, []);
                renderHighlight(otherSide, getMatchedRanges(side));
            }

            function scheduleSelectionHighlight(side) {
                if (side === 'result' && isTranslating) {
                    autoScrollEnabled = false;
                }
                window.clearTimeout(selectionTimer);
                selectionTimer = window.setTimeout(() => {
                    applySelectionHighlight(side);
                }, 100);
            }

            function refreshActiveHighlight() {
                if (!activeSelectionSide) {
                    return;
                }
                applySelectionHighlight(activeSelectionSide);
            }

            function syncHighlightScroll(side) {
                const textarea = getTextarea(side);
                const layer = getHighlightLayer(side);
                layer.scrollTop = textarea.scrollTop;
                layer.scrollLeft = textarea.scrollLeft;
            }

            function handleTextChanged(side) {
                updateTextIndex(side);
                clearHighlights();
            }

        function handleButtonClick() {
            if (isTranslating) {
                cancelTranslate();
            } else {
                doTranslate();
            }
        }

        function updateStats(stats) {
            document.getElementById('stat-token-count').textContent = stats.token_count;
            document.getElementById('stat-prompt-tokens').textContent = stats.prompt_tokens;
            document.getElementById('stat-complete-tokens').textContent = stats.complete_tokens;
            document.getElementById('stat-prefill-speed').textContent = stats.prefill_speed;
            document.getElementById('stat-complete-speed').textContent = stats.complete_speed;
            document.getElementById('stat-total-time').textContent = stats.total_time;
            document.getElementById('stat-ttft').textContent = stats.ttft;
            document.getElementById('stat-tpot').textContent = stats.avg_tpot;
        }

        function updateTranslationStatus(status, btn) {
            const labels = {
                loading_model: '加载模型…',
                waiting_inference: '等待推理…',
                translating: '翻译中…'
            };
            if (!cancelRequested && labels[status]) {
                btn.innerHTML = `<span class="loading"></span>${labels[status]}`;
            }
        }

        async function doTranslate() {
            const targetLanguage = document.getElementById('targetLanguage').value;
            const sourceText = document.getElementById('sourceText').value.trim();
            const referText = document.getElementById('referText').value.trim();
            const btn = document.getElementById('translateBtn');
            const resultText = document.getElementById('resultText');

            resultText.value = '';
            resultTextComplete = false;
            updateAllTextIndexes();
            clearHighlights();
            clearError();
            resetStats();

            if (!sourceText) {
                showError('请输入要翻译的文本');
                resultTextComplete = true;
                updateTextIndex('result');
                return;
            }

            if (!targetLanguage) {
                showError('请选择目标语言');
                resultTextComplete = true;
                updateTextIndex('result');
                return;
            }

            isTranslating = true;
            cancelRequested = false;
            autoScrollEnabled = true;
            currentRequestId = window.crypto?.randomUUID?.() ||
                `${Date.now()}-${Math.random().toString(16).slice(2)}`;
            btn.innerHTML = '<span class="loading"></span>翻译中…';
            btn.classList.add('btn-cancel');

            try {
                const response = await fetch('/api/translate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: sourceText,
                        target_language: targetLanguage,
                        request_id: currentRequestId,
                        refer_text: referText
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    showError(errorData.error || `翻译失败（HTTP ${response.status}）`);
                    return;
                }
                if (!response.body) {
                    throw new Error('浏览器不支持流式响应');
                }

                currentReader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let streamFailed = false;

                const processFrame = frame => {
                    const dataLine = frame.split('\n').find(line => line.startsWith('data: '));
                    if (!dataLine) {
                        return;
                    }
                    try {
                        const data = JSON.parse(dataLine.slice(6));
                        if (data.type === 'text') {
                            resultText.value += data.content;
                            updateTextIndex('result');
                            refreshActiveHighlight();
                            if (autoScrollEnabled) {
                                resultText.scrollTop = resultText.scrollHeight;
                                syncHighlightScroll('result');
                            }
                        } else if (data.type === 'status') {
                            updateTranslationStatus(data.content, btn);
                        } else if (data.type === 'error') {
                            streamFailed = true;
                            showError(data.content || '模型推理失败');
                        } else if (data.type === 'stats') {
                            updateStats(data.content);
                        }
                    } catch (error) {
                        console.error('解析流式数据失败:', error, frame);
                    }
                };

                while (true) {
                    const { done, value } = await currentReader.read();
                    if (done) {
                        buffer += decoder.decode();
                        break;
                    }

                    buffer += decoder.decode(value, { stream: true });
                    const frames = buffer.split(/\r?\n\r?\n/);
                    buffer = frames.pop();
                    for (const frame of frames) {
                        processFrame(frame);
                    }
                }

                if (buffer.trim()) {
                    processFrame(buffer);
                }
                if (!streamFailed && !cancelRequested && !resultText.value) {
                    showError('模型未返回翻译结果');
                }
            } catch (error) {
                if (error.name !== 'AbortError') {
                    console.error('翻译请求失败:', error);
                    showError(error.message || '网络错误，请稍后重试');
                }
            } finally {
                isTranslating = false;
                cancelRequested = false;
                resultTextComplete = true;
                updateTextIndex('result');
                refreshActiveHighlight();
                currentReader = null;
                currentRequestId = null;
                btn.disabled = false;
                btn.innerHTML = '翻译';
                btn.classList.remove('btn-cancel');
            }
        }

        async function cancelTranslate() {
            if (!isTranslating || !currentRequestId) {
                return;
            }

            cancelRequested = true;
            const btn = document.getElementById('translateBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>正在取消…';

            try {
                const response = await fetch('/api/cancel', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        request_id: currentRequestId
                    })
                });
                if (!response.ok && response.status !== 404) {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                console.error('取消翻译请求失败:', error);
                cancelRequested = false;
                btn.disabled = false;
                btn.innerHTML = '<span class="loading"></span>翻译中…';
                showError('取消请求失败，翻译仍在继续');
            }
        }

        document.getElementById('targetLanguage').addEventListener('change', updateQuickLangButtons);

            sourceTextarea.addEventListener('input', () => handleTextChanged('source'));
            sourceTextarea.addEventListener('scroll', () => syncHighlightScroll('source'));
            resultTextarea.addEventListener('scroll', () => syncHighlightScroll('result'));
            sourceTextarea.addEventListener('select', () => scheduleSelectionHighlight('source'));
            resultTextarea.addEventListener('select', () => scheduleSelectionHighlight('result'));

            for (const eventName of ['mouseup', 'keyup', 'touchend']) {
                sourceTextarea.addEventListener(eventName, () => scheduleSelectionHighlight('source'));
                resultTextarea.addEventListener(eventName, () => scheduleSelectionHighlight('result'));
            }

            document.addEventListener('selectionchange', () => {
                if (document.activeElement === sourceTextarea) {
                    scheduleSelectionHighlight('source');
                } else if (document.activeElement === resultTextarea) {
                    scheduleSelectionHighlight('result');
                }
            });

            document.addEventListener('mousedown', (event) => {
                if (!event.target.closest('.text-match-box')) {
                    clearHighlights();
                }
            });

            resultTextarea.addEventListener('wheel', function() {
                if (isTranslating) {
                    autoScrollEnabled = false;
                }
            });

            updateAllTextIndexes();
            loadLanguages();
    </script>
</body>
</html>
